version: "3.9"

services:

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb

    restart: unless-stopped

    ports:
      - "8000:8000"

    volumes:
      - ./docker/chromadb:/chroma/chroma

    environment:
      - IS_PERSISTENT=TRUE
      - ALLOW_RESET=TRUE

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 5